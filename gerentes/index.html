<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torre de Controle — Gerentes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#454e87">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --page: #454e87;
    --card-bg: #ffffff;
    --card-red-top: #e3646c;
    --card-red-bot: #c74e56;
    --ink: #22264a;
    --muted: #6b6f93;
    --ok: #2fae6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    padding-bottom: 32px;
  }
  header {
    padding: 22px 18px 16px;
    color: #fff;
  }
  header h1 {
    margin: 0 0 2px;
    font-size: 20px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  header p { margin: 0; font-size: 13px; opacity: 0.85; }

  .container { padding: 0 14px; max-width: 520px; margin: 0 auto; }

  .card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  }

  .unit-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 10px;
  }
  .unit-btn {
    padding: 14px 8px;
    border-radius: 10px;
    border: 2px solid #e4e6f5;
    background: #f7f8fd;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
  }
  .unit-btn.selected { border-color: var(--page); background: #eef0fb; }

  .btn {
    display: inline-block;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary { background: var(--page); color: #fff; }
  .btn-secondary { background: #eef0fb; color: var(--page); margin-top: 8px; }

  .status-linha {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c7c9df; flex: 0 0 auto; }
  .dot.ok { background: var(--ok); }

  .chegada {
    border-left: 4px solid var(--card-red-top);
    background: linear-gradient(135deg, var(--card-red-top), var(--card-red-bot));
    color: #fff;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .chegada .placa { font-size: 16px; font-weight: 800; letter-spacing: 0.03em; }
  .chegada .origem { font-size: 13px; opacity: 0.9; margin-top: 2px; }
  .chegada .linha2 { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }
  .chegada .dist { font-weight: 800; }

  .origem-resumo {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eef0fb;
    font-size: 14px;
  }
  .origem-resumo:last-child { border-bottom: none; }
  .origem-resumo .valores { text-align: right; color: var(--muted); font-size: 13px; }

  .vazio { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 4px; }
  .hidden { display: none !important; }
  .link-trocar { text-align: center; margin-top: 4px; }
  .link-trocar button { background: none; border: none; color: #fff; opacity: 0.8; font-size: 12px; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>Torre de Controle</h1>
  <p id="subtitulo">painel do gerente</p>
</header>

<div class="container">

  <!-- Tela 1: escolher a unidade (só aparece na primeira vez) -->
  <div class="card" id="tela-escolha">
    <p style="margin-top:0;font-weight:700;">Qual é a sua unidade?</p>
    <div class="unit-grid" id="grid-unidades"></div>
  </div>

  <!-- Tela 2: painel principal -->
  <div id="tela-painel" class="hidden">
    <div class="card">
      <button class="btn btn-primary" id="btn-ativar">Ativar notificações</button>
      <div class="status-linha"><span class="dot" id="dot-status"></span><span id="texto-status">Notificações desativadas</span></div>
    </div>

    <div class="card">
      <p style="margin:0 0 6px;font-weight:700;">Chegando pra sua unidade</p>
      <div id="resumo-origens"></div>
    </div>

    <div class="card">
      <p style="margin:0 0 10px;font-weight:700;">Veículos a caminho</p>
      <div id="lista-chegadas"></div>
    </div>

    <div class="link-trocar"><button id="btn-trocar">trocar unidade</button></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCATnPPe20FfVhD2lMEjyOR22kKCFtcvM",
  authDomain: "torre-de-controle-mir.firebaseapp.com",
  projectId: "torre-de-controle-mir",
  storageBucket: "torre-de-controle-mir.firebasestorage.app",
  messagingSenderId: "808973653003",
  appId: "1:808973653003:web:473147e51992b055c5630e",
};
const VAPID_KEY = "BC1KINIf5p3Dvq3GtbRPQRg7_e4Q9Bjd340LzGOvibyVWu5vkGLzfP7pZsnzJyh13EPb2awUkOSdT4DW-SkjDSQ";

const UNIDADES = [
  { cod: "RSL", nome: "Rio do Sul" },
  { cod: "GRU", nome: "Guarulhos" },
  { cod: "ITJ", nome: "Itajaí" },
  { cod: "CTB", nome: "Curitiba" },
  { cod: "POA", nome: "Porto Alegre" },
  { cod: "CMP", nome: "Campinas" },
];

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const telaEscolha = document.getElementById("tela-escolha");
const telaPainel = document.getElementById("tela-painel");
const gridUnidades = document.getElementById("grid-unidades");
const subtitulo = document.getElementById("subtitulo");
const btnAtivar = document.getElementById("btn-ativar");
const dotStatus = document.getElementById("dot-status");
const textoStatus = document.getElementById("texto-status");
const btnTrocar = document.getElementById("btn-trocar");

function unidadeSalva() {
  try { return localStorage.getItem("torre_unidade") || ""; } catch (e) { return ""; }
}
function salvarUnidade(cod) {
  try { localStorage.setItem("torre_unidade", cod); } catch (e) {}
}

function montarGridUnidades() {
  gridUnidades.innerHTML = "";
  UNIDADES.forEach((u) => {
    const b = document.createElement("button");
    b.className = "unit-btn";
    b.textContent = u.cod + " — " + u.nome;
    b.onclick = () => { salvarUnidade(u.cod); mostrarPainel(u.cod); };
    gridUnidades.appendChild(b);
  });
}

function mostrarPainel(cod) {
  const u = UNIDADES.find((x) => x.cod === cod);
  subtitulo.textContent = "painel do gerente — " + (u ? u.nome : cod);
  telaEscolha.classList.add("hidden");
  telaPainel.classList.remove("hidden");
  carregarChegadas(cod);
}

btnTrocar.onclick = () => {
  telaPainel.classList.add("hidden");
  telaEscolha.classList.remove("hidden");
};

montarGridUnidades();
const unidadeAtual = unidadeSalva();
if (unidadeAtual) mostrarPainel(unidadeAtual);

// --- Notificações ---
async function ativarNotificacoes() {
  const cod = unidadeSalva();
  if (!cod) return;
  try {
    textoStatus.textContent = "Pedindo permissão...";
    const permissao = await Notification.requestPermission();
    if (permissao !== "granted") {
      textoStatus.textContent = "Permissão negada no celular/navegador";
      return;
    }
    const registration = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if (!token) {
      textoStatus.textContent = "Não consegui gerar o token de notificação";
      return;
    }
    await setDoc(doc(db, "inscricoes_gerentes", token), {
      unidade: cod,
      atualizadoEm: serverTimestamp(),
    });
    dotStatus.classList.add("ok");
    textoStatus.textContent = "Notificações ativadas para " + cod;
    onMessage(messaging, (payload) => {
      carregarChegadas(cod);
    });
  } catch (e) {
    textoStatus.textContent = "Erro ao ativar: " + e.message;
  }
}
btnAtivar.onclick = ativarNotificacoes;

// --- Dados de "chegando pra minha unidade" ---
async function carregarChegadas(cod) {
  const resumoEl = document.getElementById("resumo-origens");
  const listaEl = document.getElementById("lista-chegadas");
  resumoEl.innerHTML = '<div class="vazio">Carregando...</div>';
  listaEl.innerHTML = "";
  try {
    const resp = await fetch("../chegando.json?_=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("ainda sem dados publicados");
    const dados = await resp.json();
    const minha = dados[cod];
    if (!minha || !minha.veiculos || minha.veiculos.length === 0) {
      resumoEl.innerHTML = '<div class="vazio">Nada a caminho no momento.</div>';
      return;
    }
    resumoEl.innerHTML = "";
    Object.entries(minha.por_origem || {}).forEach(([origem, agg]) => {
      const div = document.createElement("div");
      div.className = "origem-resumo";
      div.innerHTML = `<span>${origem} (${agg.qtde})</span><span class="valores">${Math.round(agg.peso_kg).toLocaleString("pt-BR")} kg · R$ ${agg.frete_rs.toLocaleString("pt-BR", {minimumFractionDigits:2})}</span>`;
      resumoEl.appendChild(div);
    });
    minha.veiculos.forEach((v) => {
      const div = document.createElement("div");
      div.className = "chegada";
      const dist = v.distancia_km != null ? v.distancia_km + " km" : "posição indisponível";
      div.innerHTML = `
        <div class="placa">${v.placa} — ${v.motorista || ""}</div>
        <div class="origem">de ${v.grupo_origem || v.origin_unit} · ${Math.round(v.peso_real_kg).toLocaleString("pt-BR")} kg · R$ ${v.frete_rs.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
        <div class="linha2"><span>${(v.posicao_raster && v.posicao_raster.referencia) || ""}</span><span class="dist">${dist}</span></div>
      `;
      listaEl.appendChild(div);
    });
  } catch (e) {
    resumoEl.innerHTML = '<div class="vazio">Ainda sem dados publicados — isso é normal se o servidor ainda não rodou essa parte.</div>';
  }
}
</script>
</body>
</html>
